name: Dify Daily Trigger

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  trigger-dify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Trigger Dify workflow
        env:
          DIFY_BASE_URL: ${{ secrets.DIFY_BASE_URL }}
          DIFY_APP_API_KEY: ${{ secrets.DIFY_APP_API_KEY }}
          DIFY_USER_ID: ${{ secrets.DIFY_USER_ID }}
          # 示例: {"task":"daily_multimodal_report","paper_limit":10,"news_limit":0}
          DIFY_WORKFLOW_INPUTS_JSON: ${{ secrets.DIFY_WORKFLOW_INPUTS_JSON }}
          DIFY_TRIGGER_TIMEOUT_SEC: "120"
          DIFY_TRIGGER_RETRIES: "3"
          DIFY_TRIGGER_BACKOFF_SEC: "2"
        run: python scripts/trigger_dify_workflow.py
